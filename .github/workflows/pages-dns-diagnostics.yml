name: Pages DNS Diagnostics

on:
  push:
    branches: [diagnostics/pages-dns]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare DNS responses and Pages endpoints
        run: python3 .github/scripts/pages_dns_diagnostics.py
      - name: Run GitHub's published health-check library
        env:
          GEM_HOME: ${{ runner.temp }}/pages-health-gems
          GEM_PATH: ${{ runner.temp }}/pages-health-gems
        run: |
          gem install github-pages-health-check --version 1.18.5 --no-document
          ruby .github/scripts/pages_health_check.rb
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-dns-diagnostics
          path: |
            pages-dns-diagnostics.json
            pages-health-check.json
          retention-days: 7
