name: Pages DNS Diagnostics

on:
  push:
    branches: [diagnostics/pages-dns]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare DNS responses and Pages endpoints
        run: python3 .github/scripts/pages_dns_diagnostics.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-dns-diagnostics
          path: pages-dns-diagnostics.json
          retention-days: 7
